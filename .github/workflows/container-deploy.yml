name: Container Image Deployment CI

on:
  push:
    branches:
      - main
      - deploy/*
    # NO Production deployement yet
    #tags:
    #  - v*.*.*

# Note on secrets used for connection
# They are configured as environment secrets
# HOST is the internal ip of VM containing docker
# PROXY_HOST is the host of VMs
# USERNAME is the user used for operations
# SSH_PRIVATE_KEY is the private key (shared between VM and host)

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      checks: read

    if: github.repository == 'openfoodfacts/openfoodfacts-explorer'
    strategy:
      matrix:
        env:
          - ${{ startsWith(github.ref, 'refs/tags/v') && 'off-explorer-org' || 'off-explorer-net' }}
    environment: ${{ matrix.env }}
    concurrency: ${{ matrix.env }}
    steps:
      - name: Set common variables
        run: |
          echo "SSH_USERNAME=off" >> $GITHUB_ENV
      - name: Set various variable for staging (net) deployment
        if: matrix.env == 'off-explorer-net'
        run: |
          echo "SSH_PROXY_HOST=ovh1.openfoodfacts.org" >> $GITHUB_ENV
          echo "SSH_HOST=10.1.0.200" >> $GITHUB_ENV
          # application parameters
          echo "PUBLIC_FOLKSONOMY_API_URL=https://api.folksonomy.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_OFF_BASE_URL=https://world.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_SEARCH_BASE_URL=https://search.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_AUTH_BASE_URL=https://auth.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_AUTH_PKCE_ID=explorer" >> $GITHUB_ENV
          echo "PUBLIC_KEYCLOAK_REALM=openfoodfacts" >> $GITHUB_ENV
          echo "PUBLIC_PRICES_API_URL=https://prices.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_ROBOTOFF_URL=https://robotoff.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_IMAGES_URL=https://images.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_NUTRIPATROL_URL=https://nutripatrol.openfoodfacts.net" >> $GITHUB_ENV
          echo "PUBLIC_ENVIRONMENT=staging" >> $GITHUB_ENV
      - name: Set various variable for production deployment
        if: matrix.env == 'off-explorer-org'
        run: |
          echo "NO PRODUCTION DEPLOYMENT YET" && exit 1
      - name: Wait for search service image container build workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: wait-build-service-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkName = 'Build and push Explorer Docker image';
            const ref = '${{ github.event.pull_request.head.sha || github.sha }}';
            const intervalMilliseconds = 10_000;
            const timeoutMilliseconds = 600_000;
            let now = Date.now();
            let deadline = now + timeoutMilliseconds;

            while (now <= deadline) {
              core.info(`Retrieving check runs named ${checkName} on ${context.repo.owner}/${context.repo.repo}@${ref}...`);
              const { data: { check_runs: checkRuns } } = await github.rest.checks.listForRef({
                ...context.repo,
                ref,
                check_name: checkName,
              });

              if (!checkRuns.length) {
                core.setOutput('conclusion', 'not found');
                return;
              }

              if (checkRuns.some((checkRun) => checkRun.status === 'queued')) {
                deadline = now + timeoutMilliseconds;
              }

              const completedCheck = checkRuns.find((checkRun) => checkRun.status === 'completed');
              if (completedCheck) {
                core.setOutput('conclusion', completedCheck.conclusion);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, intervalMilliseconds));
              now = Date.now();
            }

            core.setOutput('conclusion', 'timed_out');

      - name: Do something if build isn't launch
        if: steps.wait-build-service-image.outputs.conclusion == 'not found'
        run: echo job does not exist && true

      - name: Do something if build fail
        if: steps.wait-build-service-image.outputs.conclusion == 'failure'
        run: echo fail && false # fail if build fail

      - name: Do something if build timeout
        if: steps.wait-build-service-image.outputs.conclusion == 'timed_out'
        run: echo Timeout && false # fail if build time out

      - name: Checkout git repository
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ env.SSH_PROXY_HOST }}
          proxy_username: ${{ env.SSH_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Clone Git repository if not already there
            [ ! -d '${{ matrix.env }}' ] && git clone --depth 1 https://github.com/${{ github.repository }} ${{ matrix.env }} --no-single-branch 2>&1

            # Go to repository directory
            cd ${{ matrix.env }}

            # Fetch newest commits (in case it wasn't freshly cloned)
            git fetch --depth=1 origin "${{ github.sha }}"
            git checkout -qf FETCH_HEAD

      - name: Set environment variables
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ env.SSH_PROXY_HOST }}
          proxy_username: ${{ env.SSH_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Go to repository directory
            cd ${{ matrix.env }}

            # init .env
            echo "# Env file generated by container-deploy action"> .env
            echo "DOCKER_IMAGE_TAG=sha-${{ github.sha }}" >> .env
            cat >> .env <<EOF=====
            DOCKER_IMAGE_NAME=openfoodfacts/openfoodfacts-explorer
            DOCKER_EXPLORER_EXPOSE=:3000
            COMPOSE_PATH_SEPARATOR=;
            COMPOSE_FILE=docker-compose.yml
            RESTART_POLICY=unless-stopped
            EOF=====
            # Set App variables
            echo "PUBLIC_FOLKSONOMY_API_URL=${{ env.PUBLIC_FOLKSONOMY_API_URL }}" >> .env
            echo "PUBLIC_OFF_BASE_URL=${{ env.PUBLIC_OFF_BASE_URL }}" >> .env
            echo "PUBLIC_SEARCH_BASE_URL=${{ env.PUBLIC_SEARCH_BASE_URL }}" >> .env
            echo "PUBLIC_AUTH_BASE_URL=${{ env.PUBLIC_AUTH_BASE_URL }}" >> .env
            echo "PUBLIC_AUTH_PKCE_ID=${{ env.PUBLIC_AUTH_PKCE_ID }}" >> .env
            echo "PUBLIC_KEYCLOAK_REALM=${{ env.PUBLIC_KEYCLOAK_REALM }}" >> .env
            echo "PUBLIC_PRICES_API_URL=${{ env.PUBLIC_PRICES_API_URL }}" >> .env
            echo "PUBLIC_ROBOTOFF_URL=${{ env.PUBLIC_ROBOTOFF_URL }}" >> .env
            echo "PUBLIC_IMAGES_URL=${{ env.PUBLIC_IMAGES_URL }}" >> .env
            echo "PUBLIC_NUTRIPATROL_URL=${{ env.PUBLIC_NUTRIPATROL_URL }}" >> .env
            echo "PUBLIC_ENVIRONMENT=${{ env.PUBLIC_ENVIRONMENT }}" >> .env

      - name: Pull Docker image
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ env.SSH_PROXY_HOST }}
          proxy_username: ${{ env.SSH_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ matrix.env }}
            docker compose pull

      - name: Re-start services
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ env.SSH_PROXY_HOST }}
          proxy_username: ${{ env.SSH_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ matrix.env }}
            # Stop old, start new
            docker compose down || true
            docker compose up -d --wait

      - name: Check services are up
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        if: ${{ always() }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ env.SSH_PROXY_HOST }}
          proxy_username: ${{ env.SSH_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ matrix.env }}
            [[ -z $(docker compose  ps -q --status exited --status dead --status removing --status paused) ]] || exit 1

      - name: Cleanup obsolete Docker objects
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        if: ${{ always() }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ env.SSH_PROXY_HOST }}
          proxy_username: ${{ env.SSH_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          script: |
            cd ${{ matrix.env }}
            docker system prune -af
