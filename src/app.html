<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="viewport" content="width=device-width" />
		<!-- base-100 of the light/dark daisyUI themes, so the browser UI matches the page -->
		<meta name="theme-color" content="#faf7f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#201a17" media="(prefers-color-scheme: dark)" />
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('preferences');
					const preferences = stored ? JSON.parse(stored) : {};
					const theme = preferences.theme;

					if (theme === 'light' || theme === 'dark') {
						document.documentElement.setAttribute('data-theme', theme);
					} else {
						const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
						document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
					}
				} catch {
					const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
